<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161a1d" />
    <meta
      name="description"
      content="A 12-week autoregulated strength, hypertrophy, athleticism, and mobility training system."
    />
    <title>12-Week Hypertrophy Training System</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <noscript>This training system requires JavaScript to save workouts and calculate progress.</noscript>
    <div id="app" class="app-loading" aria-live="polite">
      <div class="loader-mark">F</div>
      <p>Loading your training system...</p>
    </div>
    <input id="restore-file" type="file" accept="application/json,.json" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
